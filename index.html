// Modal QRIS manual: tampilkan QR statis, pembeli upload bukti transfer,
// order tersimpan sebagai "pending", lalu polling sampai admin/bot
// menekan ACC ("approved") atau Tolak ("rejected"). onApproved dipanggil
// SEKALI setelah status jadi "approved" (apikey/kuota sudah diterbitkan
// oleh finalizeManualOrder di sisi yang meng-ACC, bukan di sini).
function openManualQrisModal(nominal, label, kind, meta, buyer, onApproved) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay"; overlay.id = "checkoutOverlay";
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:380px; text-align:center;">
      <h2 class="modal-title">Bayar dengan QRIS</h2>
      <p class="modal-sub">${esc(label)} — ${rupiah(nominal)}</p>
      <img src="${esc(state.settings.payment.qrisImage)}" alt="QRIS" style="width:100%; max-width:240px; border-radius:8px; margin:10px auto; display:block; border:1px solid var(--border);" />
      <p class="desc" style="margin:6px 0 12px;">Scan &amp; transfer tepat <strong>${rupiah(nominal)}</strong>, lalu upload screenshot bukti pembayaran di bawah ini.</p>
      <label class="field" style="text-align:left;">
        <span>Bukti pembayaran (screenshot)</span>
        <input class="input" type="file" accept="image/*" id="proofFileInput" />
      </label>
      <div id="checkoutBody" style="margin-top:10px;"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="proofSubmitBtn" style="width:100%;">Kirim bukti &amp; tunggu konfirmasi</button>
        <button class="btn btn-secondary" id="checkoutCancel" style="width:100%; margin-top:8px;">Batalkan</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  let polling = null, orderId = null, submitting = false;
  const close = () => { clearInterval(polling); overlay.remove(); };
  overlay.querySelector("#checkoutCancel").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

  overlay.querySelector("#proofSubmitBtn").addEventListener("click", async () => {
    if (submitting || orderId) return;
    const fileInput = overlay.querySelector("#proofFileInput");
    const body = overlay.querySelector("#checkoutBody");
    const file = fileInput.files && fileInput.files[0];
    if (!file) { body.innerHTML = `<div class="danger-text" style="font-size:13px;">Upload bukti pembayaran dulu.</div>`; return; }
    submitting = true;
    const submitBtn = overlay.querySelector("#proofSubmitBtn");
    submitBtn.disabled = true;
    body.innerHTML = `<div class="muted" style="font-size:13px;">Mengunggah bukti…</div>`;
    try {
      const proofImage = await compressImageFile(file);
      const order = {
        id: uid(), kind, buyer: buyer || state.currentUser?.username || "guest",
        buyerTelegramId: state.currentUser?.telegramId || "",
        detail: label, price: nominal, meta: meta || null,
        proofImage, status: "pending", createdAt: now(),
        notified: false, notifyAttempts: 0, notifiedChatId: null, notifiedMessageId: null, notifiedCaption: null,
        decidedAt: null, decidedBy: null, decidedNote: null,
      };
      await submitManualOrder(order);
      orderId = order.id;
      fileInput.disabled = true;
      submitBtn.style.display = "none";
      body.innerHTML = `<div class="muted" style="font-size:13px;">Bukti terkirim ke admin. Menunggu konfirmasi ACC/Tolak lewat Telegram…</div>`;
      polling = setInterval(async () => {
        const row = await refreshManualOrderStatus(orderId);
        if (!row) return;
        if (row.status === "approved") {
          clearInterval(polling);
          overlay.remove();
          onApproved();
        } else if (row.status === "rejected") {
          clearInterval(polling);
          body.innerHTML = `<div class="danger-text" style="font-size:13px;">Bukti pembayaran ditolak admin${row.decidedNote ? ": " + esc(row.decidedNote) : "."} Tutup lalu coba lagi dengan bukti yang benar.</div>`;
        }
      }, 4000);
    } catch (e) {
      body.innerHTML = `<div class="danger-text" style="font-size:13px;">Gagal mengunggah bukti: ${esc(e.message)}</div>`;
      submitBtn.disabled = false;
    } finally {
      submitting = false;
    }
  });
}

bindHandlers.migration = () => {
  let applyLocally = false;
  const statusEl = document.getElementById("migStatus");
  const pushBtn = document.getElementById("migPushBtn");
  const setStatus = (html, cls) => { statusEl.innerHTML = html; statusEl.className = cls || "muted"; statusEl.style.fontSize = "13px"; };

  document.getElementById("migApplyToggle").addEventListener("click", (e) => { applyLocally = !applyLocally; e.currentTarget.classList.toggle("on", applyLocally); });

  document.getElementById("migFetchBtn").addEventListener("click", async () => {
    const repo = document.getElementById("migSrcRepo").value.trim();
    const branch = document.getElementById("migSrcBranch").value.trim() || "main";
    const token = document.getElementById("migSrcToken").value.trim();
    const path = document.getElementById("migSrcPath").value.trim() || "worldmarket-database.json";
    if (!repo) return notify("Isi repo sumber dulu.");
    setStatus("Mengambil file dari repo sumber…");
    try {
      const file = await ghGetFile(repo, branch, token, path);
      if (!file) { setStatus(`File "${esc(path)}" tidak ditemukan di ${esc(repo)}.`, "danger-text"); return; }
      let preview;
      try {
        const parsed = JSON.parse(file.text);
        preview = `Owner: ${parsed.owners?.length ?? 0} · Role: ${parsed.roles?.length ?? 0} · Apikey: ${parsed.apikeys?.length ?? 0} · Kuota: ${parsed.quotas?.length ?? 0} · Warn: ${parsed.warns?.length ?? 0}`;
      } catch { preview = "File ditemukan, tapi bukan format JSON yang dikenali. Tetap bisa dipindahkan apa adanya."; }
      state.migration.fetchedText = file.text;
      state.migration.fetchedFrom = `${repo}@${branch}/${path}`;
      setStatus(`Berhasil ambil dari ${esc(repo)}. ${esc(preview)}`, "ok-text");
      pushBtn.disabled = false;
    } catch (e) { setStatus(`Gagal ambil dari sumber: ${esc(e.message)}`, "danger-text"); }
  });

  pushBtn.addEventListener("click", async () => {
    const repo = document.getElementById("migDstRepo").value.trim();
    const branch = document.getElementById("migDstBranch").value.trim() || "main";
    const token = document.getElementById("migDstToken").value.trim();
    const path = document.getElementById("migDstPath").value.trim() || "worldmarket-database.json";
    if (!repo || !token) return notify("Isi repo tujuan dan token dulu.");
    if (!state.migration.fetchedText) return notify("Ambil data dari sumber dulu.");
    setStatus("Menyimpan ke repo tujuan…");
    try {
      let sha;
      try { const existing = await ghGetFile(repo, branch, token, path); if (existing) sha = existing.sha; } catch {}
      await ghPutFile(repo, branch, token, path, state.migration.fetchedText, sha, `Migrasi database dari ${state.migration.fetchedFrom}`);
      setStatus(`Berhasil dipindahkan ke ${esc(repo)}/${esc(path)}.`, "ok-text");
      notify("Migrasi database berhasil.");
      if (applyLocally) {
        try {
          const parsed = JSON.parse(state.migration.fetchedText);
          if (parsed.owners) state.owners = parsed.owners;
          if (parsed.roles) state.roles = parsed.roles;
          if (parsed.apikeys) state.apikeys = parsed.apikeys;
          if (parsed.quotas) state.quotas = parsed.quotas;
          if (parsed.warns) state.warns = parsed.warns;
          if (parsed.settings) state.settings = { ...JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), ...parsed.settings };
          await Promise.all([
            saveKey("wm:owners", state.owners), saveKey("wm:roles", state.roles), saveKey("wm:apikeys", state.apikeys),
            saveKey("wm:quotas", state.quotas), saveKey("wm:warns", state.warns), saveKey("wm:settings", state.settings),
          ]);
          notify("Data hasil migrasi diterapkan ke panel ini.");
          renderAll();
        } catch (e) { notify("Gagal menerapkan data ke panel: " + e.message); }
      }
    } catch (e) { setStatus(`Gagal simpan ke tujuan: ${esc(e.message)}`, "danger-text"); }
  });
};

bindHandlers["settings-session"] = () => {
  if (!state.settings.sessionLogin) state.settings.sessionLogin = { enabled: true, videoUrl: "", durationMs: 2500 };
  const sl = state.settings.sessionLogin;
  const urlInput = document.getElementById("slVideoUrl");
  const fileInput = document.getElementById("slVideoFile");
  const MAX_VIDEO_BYTES = 5 * 1024 * 1024; // 5 MB — dijaga kecil supaya aman untuk localStorage & database (jsonb)
  let pendingUploadedVideo = null; // dataURL hasil upload file, menang atas isian link kalau ada

  const renderPreview = (videoSrc, isUploaded) => {
    const wrap = document.getElementById("slPreviewWrap");
    wrap.innerHTML = videoSrc
      ? `<video id="slPreview" src="${esc(videoSrc)}" muted loop autoplay playsinline style="width:100%; max-width:340px; border-radius:10px; border:1px solid var(--border);"></video>${isUploaded ? `<div style="margin-top:6px;"><button class="btn btn-ghost btn-danger" id="slRemoveVideoBtn" type="button">Hapus video terupload</button></div>` : ""}`
      : `<div class="muted" style="font-size:13px;" id="slPreviewEmpty">Belum ada video diisi.</div>`;
    const removeBtn = document.getElementById("slRemoveVideoBtn");
    if (removeBtn) removeBtn.addEventListener("click", () => {
      pendingUploadedVideo = ""; fileInput.value = "";
      document.getElementById("slFileStatus").textContent = "Video terupload akan dihapus setelah kamu klik \"Simpan Konfigurasi\".";
      renderPreview("", false);
    });
  };

  urlInput.addEventListener("change", () => {
    if (urlInput.value.trim()) { pendingUploadedVideo = null; fileInput.value = ""; document.getElementById("slFileStatus").textContent = ""; }
    renderPreview(urlInput.value.trim(), false);
  });

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    const statusEl = document.getElementById("slFileStatus");
    if (!file) return;
    if (!file.type.startsWith("video/")) { statusEl.textContent = "File yang dipilih bukan video. Pilih file .mp4."; fileInput.value = ""; return; }
    if (file.size > MAX_VIDEO_BYTES) {
      statusEl.textContent = `File terlalu besar (${(file.size / 1024 / 1024).toFixed(1)} MB). Maksimal 5 MB — kompres dulu videonya lalu upload ulang.`;
      fileInput.value = "";
      return;
    }
    statusEl.textContent = "Memproses video…";
    try {
      const dataUrl = await fileToDataUrl(file);
      pendingUploadedVideo = dataUrl;
      urlInput.value = "";
      statusEl.textContent = `Video siap (${(file.size / 1024 / 1024).toFixed(1)} MB). Klik "Simpan Konfigurasi" untuk menyimpannya.`;
      renderPreview(dataUrl, true);
    } catch (e) { statusEl.textContent = "Gagal membaca file video: " + e.message; }
  });

  document.getElementById("slSaveBtn").addEventListener("click", async () => {
    sl.enabled = document.getElementById("slEnabled").value === "1";
    if (pendingUploadedVideo !== null) sl.videoUrl = pendingUploadedVideo;
    else if (urlInput.value.trim()) sl.videoUrl = urlInput.value.trim();
    const durationSec = Number(document.getElementById("slDuration").value);
    sl.durationMs = Number.isFinite(durationSec) && durationSec > 0 ? Math.round(durationSec * 1000) : 2500;
    await saveSettingsWithConfirmation("slSaveStatus");
  });
};

function viewManualPayments() {
  const orders = [...state.manualOrders].sort((a, b) => b.createdAt - a.createdAt);
  const pending = orders.filter((o) => o.status === "pending");
  const decided = orders.filter((o) => o.status !== "pending").slice(0, 30);
  const card = (o) => `
    <div class="panel" style="margin-bottom:12px;" data-order-card="${o.id}">
      <div class="panel-title">${esc(o.detail)} \u2014 ${rupiah(o.price)}</div>
      <div class="muted" style="font-size:12.5px; margin-bottom:8px;">Pembeli: ${esc(o.buyer)}${o.buyerTelegramId ? " \u00b7 TG " + esc(o.buyerTelegramId) : ""} \u00b7 ${fmtDate(o.createdAt)}</div>
      ${o.proofImage ? `<img src="${o.proofImage}" style="max-width:220px; border-radius:8px; border:1px solid var(--border); display:block; margin-bottom:10px;" />` : `<div class="muted" style="font-size:12.5px;">Tidak ada gambar bukti.</div>`}
      ${o.status === "pending"
        ? `<div class="form-row">
             <button class="btn btn-primary" data-acc-order="${o.id}">\u2705 ACC</button>
             <button class="btn btn-ghost btn-danger" data-reject-order="${o.id}">\u274c Tolak</button>
           </div>
           ${o.notified ? `<p class="desc" style="margin-top:8px;">Sudah dikirim ke Telegram owner, menunggu ditekan di sana atau di sini.</p>` : `<p class="desc" style="margin-top:8px;">Belum terkirim ke Telegram (cek Owner Telegram ID di Pengaturan, atau bot sedang offline) \u2014 tetap bisa di-ACC/Tolak manual dari sini.</p>`}`
        : `<span class="pill ${o.status === "approved" ? "pill-on" : "pill-danger"}">${o.status === "approved" ? "Disetujui" : "Ditolak"}</span>
           <span class="muted" style="font-size:12px;">${o.decidedAt ? "\u00b7 " + fmtDate(o.decidedAt) : ""}${o.decidedBy ? " oleh " + esc(String(o.decidedBy)) : ""}</span>
           ${o.decidedNote ? `<p class="desc" style="margin-top:6px;">Catatan: ${esc(o.decidedNote)}</p>` : ""}`}
    </div>`;
  return `
    <div class="view">
      ${sectionHead("Admin \u00b7 Konfirmasi Pembayaran", "QRIS Manual", "Tekan ACC untuk meloloskan pesanan (apikey/kuota langsung diterbitkan) atau Tolak untuk membatalkan. Tombol yang sama juga tersedia lewat bot Telegram, dan hasilnya saling sinkron.", true)}
      <div class="panel-title" style="margin-bottom:4px;">Menunggu konfirmasi (${pending.length})</div>
      ${pending.length === 0 ? `<div class="empty">Tidak ada pembayaran yang menunggu konfirmasi.</div>` : pending.map(card).join("")}
      ${decided.length > 0 ? `<div class="panel-title" style="margin-top:18px;">Riwayat</div>${decided.map(card).join("")}` : ""}
    </div>`;
}

        ${bootstrapFilled

          : `<div class="kv"><span>Bootstrap di source code</span><span class="pill pill-danger">belum diisi</span></div><p class="desc">Tanpa ini, pengaturan yang kamu isi di sini <strong>hanya tersimpan di browser kamu sendiri</strong> — pengunjung lain tidak akan otomatis dapat konfigurasi yang sama. Cari <code>BOOTSTRAP_SUPABASE</code> di bagian atas <code>&lt;script&gt;</code> pada file <code>worldmarket-panel.html</code>, isi <code>url</code> dan <code>anonKey</code> dengan nilai di bawah ini, lalu upload ulang file itu ke hosting kamu — cukup sekali saja.</p>`}
      </div>

      <div class="panel">
        <div class="grid-2">
          <label class="field"><span>Project URL</span><input class="input" id="sbUrl" value="${esc(sb.url)}" placeholder="https://xxxx.supabase.co" /></label>
          <label class="field"><span>Anon public key</span><input class="input" type="password" id="sbKey" value="${esc(sb.anonKey)}" placeholder="eyJhbGciOi…" /></label>
          <label class="field"><span>Nama tabel</span><input class="input" id="sbTable" value="${esc(sb.table)}" /></label>
        </div>
        <div class="form-row" style="margin-top:10px;">
          <button class="btn btn-violet" id="sbSaveBtn">Simpan Konfigurasi</button>
          <button class="btn btn-secondary" id="sbTestBtn">Tes koneksi</button>
        </div>
        <div id="sbStatus" class="muted" style="font-size:13px; margin-top:10px;"></div>
      </div>

      <div class="panel" id="sqlSetupPanel">
        <div class="panel-title">SQL setup</div>
        <p class="desc" style="margin-bottom:14px;">Cukup satu tabel generik untuk semuanya — jalankan sekali lewat SQL Editor di Supabase. Anon key (dipakai browser) sengaja <strong>tidak diizinkan</strong> membuat tabel sendiri (proteksi Supabase), jadi langkah ini memang harus manual sekali di awal:</p>
        <pre class="mono" id="sqlSetupBlock" style="background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:12px; font-size:11.5px; overflow-x:auto; white-space:pre;">create table if not exists public.${esc(sb.table || "kv_worldmd")} (
  key text primary key,
  value jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.${esc(sb.table || "kv_worldmd")} enable row level security;
create policy "wm allow anon" on public.${esc(sb.table || "kv_worldmd")}
  for all using (true) with check (true);</pre>
        <div class="form-row" style="margin-top:10px;">
          <button class="btn btn-secondary" id="sqlCopyBtn">Salin SQL</button>
          <button class="btn btn-secondary" id="sqlEditorBtn">Buka SQL Editor Supabase ↗</button>
        </div>
        <div id="sqlCopyStatus" class="muted" style="font-size:13px; margin-top:8px;"></div>
        <p class="desc" style="margin-top:14px;">Policy di atas sengaja permisif (bisa dibaca & ditulis siapa saja yang tahu anon key) karena panel ini memakai anon key dari sisi browser, bukan autentikasi server sungguhan. Ini trade-off yang disengaja supaya semua pengunjung bisa otomatis mendapat pengaturan terbaru tanpa server tambahan — konsekuensinya, siapa pun yang cukup teliti membuka DevTools bisa melihat (dan secara teknis mengubah) isi tabel ini, termasuk token GitHub, API key payment, dan API key AI yang kamu simpan di Pengaturan. Gunakan token/API key dengan scope seminimal mungkin, dan rotasi berkala.</p>
        <p class="desc" style="margin-top:10px;">Tabel yang sama dipakai bareng <strong>bot Telegram verifikasi</strong> (folder <code>bot/</code>) lewat key <code>wm_verifications</code> dan <code>wm_bot_groups</code> di dalamnya.</p>
      </div>
    </div>`;
}
function supabaseProjectRef(url) {
  try { return new URL(url).hostname.split(".")[0] || ""; } catch { return ""; }
}
bindHandlers["settings-supabase"] = () => {
  const sb = state.settings.supabase;

  function flashSqlPanel(showCta) {
    const panel = document.getElementById("sqlSetupPanel");
    if (!panel) return;
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
    panel.style.transition = "box-shadow .3s, border-color .3s";
    panel.style.boxShadow = "0 0 0 2px var(--red)";
    panel.style.borderColor = "var(--red)";
    setTimeout(() => { panel.style.boxShadow = ""; panel.style.borderColor = ""; }, 2200);
  }

  document.getElementById("sqlCopyBtn").addEventListener("click", async () => {
    const sqlText = document.getElementById("sqlSetupBlock").textContent;
    const statusEl = document.getElementById("sqlCopyStatus");
    try {
      await navigator.clipboard.writeText(sqlText);
      statusEl.textContent = "SQL disalin. Tempel di Supabase → SQL Editor → Run."; statusEl.className = "ok-text";
    } catch {
      statusEl.textContent = "Gagal menyalin otomatis — seleksi & salin manual dari kotak di atas."; statusEl.className = "danger-text";
    }
  });
  document.getElementById("sqlEditorBtn").addEventListener("click", () => {
    const url = document.getElementById("sbUrl").value.trim();
    const ref = supabaseProjectRef(url);
    const dest = ref ? `https://supabase.com/dashboard/project/${ref}/sql/new` : "https://supabase.com/dashboard";
    if (!ref) notify("Isi Project URL dulu supaya bisa langsung diarahkan ke project yang benar.");
    window.open(dest, "_blank", "noopener");
  });

  document.getElementById("sbSaveBtn").addEventListener("click", async () => {
    const statusEl = document.getElementById("sbStatus");
    sb.url = document.getElementById("sbUrl").value.trim();
    sb.anonKey = document.getElementById("sbKey").value.trim();
    sb.table = document.getElementById("sbTable").value.trim() || "kv_worldmd";
    await saveSettingsWithConfirmation("sbStatus");
    if (sb.url && sb.anonKey) {
      try {
        const res = await fetch(`${sb.url}/rest/v1/${sb.table}?select=key&limit=1`, { headers: { apikey: sb.anonKey, Authorization: `Bearer ${sb.anonKey}` } });
        if (res.status === 404) {
          statusEl.textContent = "Tersimpan, tapi tabel belum ada di Supabase. Jalankan SQL setup di bawah dulu."; statusEl.className = "danger-text";
          flashSqlPanel(true);
          return;
        }
      } catch { /* biarkan pesan sukses save tetap tampil kalau tes gagal karena jaringan */ }
    }
    render();
  });
  document.getElementById("sbTestBtn").addEventListener("click", async () => {
    const statusEl = document.getElementById("sbStatus");
    const url = document.getElementById("sbUrl").value.trim();
    const anonKey = document.getElementById("sbKey").value.trim();
    const table = document.getElementById("sbTable").value.trim() || "kv_worldmd";
    if (!url || !anonKey) { statusEl.textContent = "Isi Project URL dan Anon key dulu."; statusEl.className = "danger-text"; return; }
    statusEl.textContent = "Menguji koneksi…"; statusEl.className = "muted";
    try {
      const res = await fetch(`${url}/rest/v1/${table}?select=key&limit=1`, { headers: { apikey: anonKey, Authorization: `Bearer ${anonKey}` } });
      if (!res.ok) {
        const map = { 401: "Anon key tidak valid.", 403: "Row Level Security menolak akses. Cek policy tabel.", 404: "Tabel tidak ditemukan. Jalankan SQL setup dulu (lihat panel di bawah — klik \"Salin SQL\", lalu \"Buka SQL Editor Supabase\")." };
        const err = new Error(map[res.status] || `Gagal terhubung (HTTP ${res.status}).`);
        err.httpStatus = res.status;
        throw err;
      }
      sb.url = url; sb.anonKey = anonKey; sb.table = table;
      await saveSettingsWithConfirmation("sbStatus");
      statusEl.textContent = "Berhasil terhubung & konfigurasi tersimpan."; statusEl.className = "ok-text";
    } catch (e) {
      statusEl.textContent = "Gagal terhubung: " + e.message; statusEl.className = "danger-text";
      if (e.httpStatus === 404) flashSqlPanel(true);
    }
  });
};

function viewSettingsAccounts() {
  const sb = state.settings.supabase;
  return `
    <div class="view">
      ${sectionHead("Admin · Akun Admin & User", "Kelola akses masuk", "Ganti kredensial admin, dan lihat/hapus akun user yang mendaftar dari halaman publik.", true)}
      <div class="panel">
        <div class="panel-title">Akun admin</div>
        <p class="desc" style="margin-bottom:14px;">Username saat ini: <strong>${esc(state.admin.username)}</strong>. Ganti password secara berkala.</p>
        <div class="grid-2">
          <label class="field"><span>Username baru</span><input class="input" id="admNewUser" placeholder="${esc(state.admin.username)}" /></label>
          <label class="field"><span>Password baru</span><input class="input" type="password" id="admNewPass" placeholder="••••••••" /></label>
        </div>
        <div class="field"><span>Password saat ini (konfirmasi)</span><input class="input" type="password" id="admCurrentPass" /></div>
        <div class="modal-error" id="admError" style="margin:6px 0 0;"></div>
        <button class="btn btn-secondary" id="admSaveBtn" style="margin-top:10px;">Simpan akun admin</button>
      </div>
      <div class="panel">
        <div class="panel-title">Akun user terdaftar</div>
        <p class="desc" style="margin-bottom:14px;">Semua akun yang dibuat pengunjung lewat "Masuk / Daftar" di halaman publik${sb.url && sb.anonKey ? " (dari Supabase)" : " (dari penyimpanan lokal)"}.</p>
        <div id="userListArea"><div class="muted" style="font-size:13px;">Memuat daftar user…</div></div>
      </div>
    </div>`;
}
bindHandlers["settings-accounts"] = () => {
  document.getElementById("admSaveBtn").addEventListener("click", () => {
    const newUser = document.getElementById("admNewUser").value.trim();
    const newPass = document.getElementById("admNewPass").value;
    const currentPass = document.getElementById("admCurrentPass").value;
    const errEl = document.getElementById("admError");
    if (currentPass !== state.admin.password) { errEl.textContent = "Password saat ini salah."; return; }
    if (!newUser && !newPass) { errEl.textContent = "Isi username baru atau password baru dulu."; return; }
    if (newUser) state.admin.username = newUser;
    if (newPass) state.admin.password = newPass;
    saveKey("wm:admin", state.admin);
    errEl.textContent = ""; notify("Akun admin diperbarui.");
    renderAdminCorner(); render();
  });

  async function loadAndRenderUserList() {
    const area = document.getElementById("userListArea");
    const list = await usersListAll();
    if (!area) return;
    area.innerHTML = list.length === 0 ? `<div class="empty">Belum ada user yang mendaftar.</div>` : `
      <table class="table"><thead><tr><th>Username</th><th>Terdaftar</th><th></th></tr></thead><tbody>
        ${list.map((u) => `<tr><td class="mono">${esc(u.username)}</td><td class="muted">${fmtDate(u.createdAt)}</td><td><button class="btn btn-ghost btn-danger" data-remove-user="${u.id}">Hapus</button></td></tr>`).join("")}
      </tbody></table>`;
    area.querySelectorAll("[data-remove-user]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {
          await usersDelete(btn.dataset.removeUser);
          if (state.currentUser && state.currentUser.id === btn.dataset.removeUser) state.currentUser = null;
          notify("Akun user dihapus.");
          loadAndRenderUserList();
          renderAdminCorner();
        } catch (e) { notify("Gagal hapus: " + e.message); }
      });
    });
  }
  loadAndRenderUserList();
};

boot();
</script>
